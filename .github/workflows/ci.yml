name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The server binds real loopback ports and touches the filesystem, so
        # the tests are worth running on every platform rather than one.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  plugin:
    name: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: npm ci
        working-directory: plugin

      - run: npx tsc --noEmit
        working-directory: plugin

      - run: npm run build
        working-directory: plugin

      # Figma loads these two files by name from the manifest; a build that
      # produces neither would fail only once someone tried to import it.
      - name: Check build artifacts
        run: test -f plugin/dist/code.js && test -f plugin/dist/index.html

  smoke:
    name: end-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: cargo build --release -p figma-mcp
      - run: npm install
      - name: Drive the real binary with a stub host
        run: node scripts/smoke.mjs ./target/release/figma-mcp
